name: iOS CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      export_method:
        description: 'IPA export method (archive job, requires signing secrets)'
        required: false
        type: choice
        default: development
        options:
          - development
          - app-store-connect

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PROJECT: Aeris.xcodeproj
  SCHEME: Aeris
  BUNDLE_ID: com.aeris.ride
  DERIVED_DATA: build/DerivedData
  ARCHIVE_PATH: build/Aeris.xcarchive
  EXPORT_PATH: build/export

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — clean build + unit tests on the iOS Simulator.
  # Requires no signing secrets; runs on every push/PR.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Unit Tests (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable — Xcode 26.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      # The .xcodeproj is generated from project.yml and is gitignored,
      # so CI must regenerate it exactly like a fresh clone would.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          SIM_NAME=$(xcrun simctl list --json devices available \
            | jq -r '[.devices | to_entries[] | .value[]
                      | select(.name | startswith("iPhone"))]
                     | map(.name) | unique | sort | reverse | .[0]')
          if [ -z "$SIM_NAME" ]; then
            echo "::error::No iPhone simulator found"
            exit 1
          fi
          echo "Using simulator: $SIM_NAME"
          echo "destination=platform=iOS Simulator,name=$SIM_NAME,OS=latest" >> "$GITHUB_OUTPUT"

      - name: Clean & build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            2>&1 | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath build/TestResults.xcresult \
            2>&1 | tee test.log

      - name: Zip simulator build
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Aeris.app"
          ditto -c -k --keepParent "$APP_PATH" Aeris-simulator.zip

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aeris-simulator-build
          path: Aeris-simulator.zip
          retention-days: 7

      - name: Upload logs & test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
            build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2 — archive + export a signed .ipa.
  # Runs only on manual dispatch or version tags, and only proceeds when the
  # signing secrets are configured (see README → CI/CD section).
  # ---------------------------------------------------------------------------
  archive-and-export:
    name: Archive & Export Signed IPA
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPORT_METHOD: ${{ github.event.inputs.export_method || 'development' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable — Xcode 26.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # --- Signing secrets guard ---------------------------------------------
      - name: Verify signing secrets are configured
        env:
          CERT_B64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for var in CERT_B64 CERT_PASS PROFILE_B64 KEYCHAIN_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret '$var' is not set."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add CERTIFICATE_P12_BASE64, CERTIFICATE_PASSWORD, PROVISIONING_PROFILE_BASE64 and KEYCHAIN_PASSWORD to the repository secrets (README → CI/CD)."
            exit 1
          fi

      # --- Decode secrets to temporary files ---------------------------------
      - name: Decode certificate & provisioning profile
        env:
          CERT_B64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/signing.mobileprovision"
          echo -n "$CERT_B64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_B64" | base64 --decode -o "$PROFILE_PATH"
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      # --- Temporary keychain -------------------------------------------------
      - name: Create temporary keychain & import certificate
        env:
          CERT_PASS: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/aeris-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASS" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # --- Provisioning profile ------------------------------------------------
      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Read profile metadata (name & team id)
        run: |
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -)
          echo "Profile: $PROFILE_NAME (team $TEAM_ID)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      # --- ExportOptions -------------------------------------------------------
      - name: Prepare ExportOptions.plist
        run: |
          if [ "$EXPORT_METHOD" = "app-store-connect" ]; then
            PLIST="ExportOptions-AppStore.plist"
            SIGNING_IDENTITY="Apple Distribution"
          else
            PLIST="ExportOptions.plist"
            SIGNING_IDENTITY="Apple Development"
          fi
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :signingCertificate $SIGNING_IDENTITY" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$BUNDLE_ID $PROFILE_NAME" "$PLIST"
          echo "Using $PLIST (method: $EXPORT_METHOD, identity: $SIGNING_IDENTITY)"
          echo "EXPORT_PLIST=$PLIST" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      # --- Archive & export ----------------------------------------------------
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee archive.log

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PLIST" \
            2>&1 | tee export.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aeris-ipa-${{ env.EXPORT_METHOD }}
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
          retention-days: 7

      # --- Cleanup -------------------------------------------------------------
      - name: Remove temporary keychain & profile
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "$PROFILE_UUID" ]; then
            rm -f ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          fi
